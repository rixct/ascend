name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-app.sh
      - run: python3 native/tests/bridge_smoke.py
      - run: ./native/tests/run-notifications.sh
      - run: ./native/tests/run-skill-tree.sh
      - run: ./native/tests/run-quest-tree.sh
      - run: ./native/tests/run-sessions.sh
      - run: ./native/tests/run-routine.sh
      - run: ./native/tests/run-presence.sh
      - run: ./native/tests/run-stability.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ASCEND-macos
          path: dist/ASCEND.app
          if-no-files-found: error
