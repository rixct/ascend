[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
ascend-core = { path = "crates/ascend-core" }
ascend-storage = { path = "crates/ascend-storage" }
ascend-planner = { path = "crates/ascend-planner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

